version: "3.9"

networks:
    shop:
        driver: bridge

volumes:
    catalog_db_data:
    auth_db_data:
    orders_db_data:
    redis_data:

services:
    # ── Databases ──────────────────────────────────────────────
    catalog_db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
            POSTGRES_USER: ${POSTGRES_USER:-shop}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
        volumes:
            - catalog_db_data:/var/lib/postgresql/data
        networks:
            - shop
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-shop} -d ${CATALOG_DB_NAME:-catalog}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    auth_db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${AUTH_DB_NAME:-auth}
            POSTGRES_USER: ${POSTGRES_USER:-shop}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
        volumes:
            - auth_db_data:/var/lib/postgresql/data
        networks:
            - shop
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-shop} -d ${AUTH_DB_NAME:-auth}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    orders_db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${ORDERS_DB_NAME:-orders}
            POSTGRES_USER: ${POSTGRES_USER:-shop}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
        volumes:
            - orders_db_data:/var/lib/postgresql/data
        networks:
            - shop
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-shop} -d ${ORDERS_DB_NAME:-orders}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        volumes:
            - redis_data:/data
        networks:
            - shop
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ── Microservices ──────────────────────────────────────────
    auth:
        build:
            context: ./services/auth
            dockerfile: Dockerfile
        environment:
            PORT: 3004
            DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@auth_db:5432/${AUTH_DB_NAME:-auth}
            JWT_SECRET: ${JWT_SECRET:-supersecret}
        depends_on:
            auth_db:
                condition: service_healthy
        networks:
            - shop
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3004/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5

    catalog:
        build:
            context: ./services/catalog
            dockerfile: Dockerfile
        environment:
            PORT: 3001
            DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@catalog_db:5432/${CATALOG_DB_NAME:-catalog}
        depends_on:
            catalog_db:
                condition: service_healthy
        networks:
            - shop
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3001/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5

    cart:
        build:
            context: ./services/cart
            dockerfile: Dockerfile
        environment:
            PORT: 3002
            REDIS_URL: redis://redis:6379
            JWT_SECRET: ${JWT_SECRET:-supersecret}
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - shop
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3002/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5

    orders:
        build:
            context: ./services/orders
            dockerfile: Dockerfile
        environment:
            PORT: 3003
            DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@orders_db:5432/${ORDERS_DB_NAME:-orders}
            CATALOG_URL: http://catalog:3001
            CART_URL: http://cart:3002
            JWT_SECRET: ${JWT_SECRET:-supersecret}
        depends_on:
            orders_db:
                condition: service_healthy
            catalog:
                condition: service_healthy
            cart:
                condition: service_healthy
        networks:
            - shop
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3003/health || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5

    # ── Frontend ───────────────────────────────────────────────
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        environment:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        depends_on:
            - gateway
        networks:
            - shop
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
            interval: 20s
            timeout: 10s
            retries: 5

    # ── Gateway ────────────────────────────────────────────────
    gateway:
        build:
            context: ./gateway
            dockerfile: Dockerfile
        ports:
            - "${GATEWAY_PORT:-80}:80"
        depends_on:
            auth:
                condition: service_healthy
            catalog:
                condition: service_healthy
            cart:
                condition: service_healthy
            orders:
                condition: service_healthy
        networks:
            - shop
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
